<script>
const SUPABASE_URL = "https://ueeltkwfcljqzezndicm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlZWx0a3dmY2xqcXplem5kaWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwOTEwMDEsImV4cCI6MjEwNDY2NzAwMX0.76iVXEbw1XaRDonJdo7zj8z2vXOK9DhnfMDuRTjf3tA";
let supabaseClient = null;
try{
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log("Supabase conectado!");
}catch(e){ console.log("Supabase erro, modo local", e); }

async function carregarAlunosNuvem(setAlunos){
  if(!supabaseClient) return;
  try{
    const res = await supabaseClient.from('alunos').select('*').order('created_at',{ascending:false});
    if(res.error){ console.log('Erro carregar alunos', res.error.message); return; }
    const data = res.data || [];
    if(data.length>0){
      const adapt = data.map(a=>({id:a.id, nome:a.nome, email:String(a.email).toLowerCase().trim(), senha:String(a.senha), plano:a.plano||'Mensal'}));
      setAlunos(adapt);
      console.log('Alunos da nuvem:', adapt.length);
    }
  }catch(e){ console.log('Erro nuvem', e); }
}
async function salvarAlunoNuvem(aluno){
  if(!supabaseClient){ return 'sem-supabase'; }
  try{
    const res = await supabaseClient.from('alunos').insert([{id:aluno.id, nome:aluno.nome, email:String(aluno.email).toLowerCase().trim(), senha:String(aluno.senha), plano:aluno.plano||'Mensal'}]);
    if(res.error){ console.log('Erro salvar nuvem', res.error.message); return 'erro: '+res.error.message; }
    console.log('Aluno salvo na nuvem!'); return 'ok';
  }catch(e){ console.log('Erro nuvem', e); return 'erro: '+(e.message||e); }
}

async function carregarTreinosNuvem(setTreinos){
  if(!supabaseClient) return;
  try{
    const res = await supabaseClient.from('treinos').select('*').order('created_at', {ascending:false});
    if(res.error) throw res.error;
    const lista = (res.data||[]).map(r=>({
      id: r.id,
      alunoId: r.aluno_id,
      alunoNome: r.aluno_nome,
      alunoEmail: r.aluno_email,
      nome: r.nome,
      ficha: r.ficha,
      exercicios: r.exercicios || [],
      data: r.data_treino,
      criadoPor: r.criado_por,
      objetivo: r.objetivo
    }));
    setTreinos(lista);
    try{ localStorage.setItem('mp_treinos_pro', JSON.stringify(lista)); }catch(e){}
    console.log("Treinos carregados da nuvem:", lista.length);
  }catch(e){ console.log("Erro ao carregar treinos:", e.message); }
}

async function salvarTreinoNuvem(tr){
  if(!supabaseClient) return;
  try{
    const row = {
      id: tr.id,
      aluno_id: tr.alunoId,
      aluno_nome: tr.alunoNome,
      aluno_email: tr.alunoEmail,
      nome: tr.nome,
      ficha: tr.ficha,
      exercicios: tr.exercicios,
      data_treino: tr.data,
      criado_por: tr.criadoPor,
      objetivo: tr.objetivo
    };
    const res = await supabaseClient.from('treinos').upsert(row, {onConflict:'id'});
    if(res.error) throw res.error;
    console.log("Treino salvo na nuvem:", tr.nome);
  }catch(e){ console.log("Erro ao salvar treino:", e.message); }
}

async function excluirTreinoNuvem(id){
  if(!supabaseClient) return;
  try{ await supabaseClient.from('treinos').delete().eq('id', id); }
  catch(e){ console.log("Erro ao excluir treino:", e.message); }
}

async function carregarDietasNuvem(setDietas){
  if(!supabaseClient) return;
  try{
    const res = await supabaseClient.from('dietas').select('*').order('created_at', {ascending:false});
    if(res.error) throw res.error;
    let lista = (res.data||[]).map(r=>({
      id: r.id,
      aluno: r.aluno_nome,
      alunoId: r.aluno_id,
      alunoEmail: r.aluno_email,
      objetivo: r.objetivo,
      calorias: r.calorias || 0,
      gasto: 0,
      tmb: 0,
      macros: r.macros || {proteina:0,carbo:0,gordura:0},
      refeicoes: r.refeicoes || [],
      data: r.data_dieta,
      manual: !!r.manual
    }));
    // Migração única: se a nuvem está vazia mas este aparelho tem dietas locais, sobe elas
    if(lista.length===0){
      try{
        const locais = JSON.parse(localStorage.getItem('mp_dietas_pro')||'[]');
        if(Array.isArray(locais) && locais.length>0){
          for(const d of locais){ await salvarDietaNuvem(d); }
          const res2 = await supabaseClient.from('dietas').select('*').order('created_at', {ascending:false});
          if(!res2.error){
            lista = (res2.data||[]).map(r=>({
              id: r.id, aluno: r.aluno_nome, alunoId: r.aluno_id, alunoEmail: r.aluno_email,
              objetivo: r.objetivo, calorias: r.calorias || 0, gasto: 0, tmb: 0,
              macros: r.macros || {proteina:0,carbo:0,gordura:0}, refeicoes: r.refeicoes || [],
              data: r.data_dieta, manual: !!r.manual
            }));
          }
          console.log("Dietas locais migradas para nuvem:", locais.length);
        }
      }catch(e){}
    }
    setDietas(lista);
    try{ localStorage.setItem('mp_dietas_pro', JSON.stringify(lista)); }catch(e){}
    console.log("Dietas carregadas da nuvem:", lista.length);
  }catch(e){ console.log("Erro ao carregar dietas:", e.message); }
}

async function salvarDietaNuvem(d){
  if(!supabaseClient) return;
  try{
    const row = {
      id: d.id,
      aluno_id: d.alunoId,
      aluno_nome: d.aluno,
      aluno_email: d.alunoEmail,
      objetivo: d.objetivo,
      calorias: d.calorias || 0,
      macros: d.macros,
      refeicoes: d.refeicoes,
      data_dieta: d.data,
      manual: !!d.manual
    };
    const res = await supabaseClient.from('dietas').upsert(row, {onConflict:'id'});
    if(res.error) throw res.error;
    console.log("Dieta salva na nuvem:", d.objetivo);
  }catch(e){ console.log("Erro ao salvar dieta:", e.message); }
}

async function excluirDietaNuvem(id){
  if(!supabaseClient) return;
  try{ await supabaseClient.from('dietas').delete().eq('id', id); }
  catch(e){ console.log("Erro ao excluir dieta:", e.message); }
}

<div className="flex gap-2 overflow-auto pb-3 mt-4">
{['dashboard','alunos','criar-treino','treinos','ia-treino','ia-crossfit','dietas','biblioteca','mensagens'].map(t=>(
<button key={t} onClick={()=>setTab(t)} className={`px-4 py-2.5 rounded-full text-[11px] font-extrabold whitespace-nowrap border ${tab===t?'bg-[#C9A86A] text-black border-[#C9A86A]':'bg-[#151515] border-[#2A2A2A] text-zinc-400'}`}>{t.toUpperCase()}</button>
))}
</div>

<div className="mt-4">
{tab==='alunos'&&(
<div className="space-y-3">
<div className="flex justify-between"><h3 className="font-extrabold text-sm">Alunos ({alunos.length})</h3><button onClick={()=>setShowNovo(true)} className="bg-[#C9A86A] text-black px-5 py-2.5 rounded-full text-[11px] font-extrabold">+ NOVO</button></div>
{alunos.map(a=>(
<div key={a.id} onClick={()=>setAlunoSel(a)} className={`bg-[#151515] p-4 rounded-2xl border cursor-pointer ${alunoSel?.id===a.id?'border-[#C9A86A]':'border-[#2A2A2A]'}`}>
<p className="font-extrabold text-sm">{a.nome}</p><p className="text-[11px] text-zinc-400">{a.email} • {a.plano}</p>
<button onClick={(e)=>{e.stopPropagation();excluirAluno(a);}} className="mt-2 text-red-500 text-[11px] font-bold">🗑️ Excluir aluno</button>
{alunoSel?.id===a.id&&<p className="text-[10px] text-[#C9A86A] mt-2 font-bold">✓ Selecionado</p>}
</div>
))}
{showNovo&&(
<div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
<div className="bg-[#151515] rounded-[24px] p-6 w-full max-w-sm border border-[#2A2A2A]">
<h3 className="font-extrabold mb-4">Novo Aluno</h3>
<input placeholder="Nome" value={novoAluno.nome} onChange={e=>setNovoAluno({...novoAluno,nome:e.target.value})} className="w-full bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl px-4 py-3 text-xs mb-3"/>
<input placeholder="Email" value={novoAluno.email} onChange={e=>setNovoAluno({...novoAluno,email:e.target.value})} className="w-full bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl px-4 py-3 text-xs mb-3"/>
<input placeholder="Senha" value={novoAluno.senha} onChange={e=>setNovoAluno({...novoAluno,senha:e.target.value})} className="w-full bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl px-4 py-3 text-xs mb-3"/>
<select value={novoAluno.plano} onChange={e=>setNovoAluno({...novoAluno,plano:e.target.value})} className="w-full bg-[#0A0A0A] border border-[#2A2A2A] rounded-xl px-4 py-3 text-xs mb-4"><option>Mensal</option><option>Trimestral</option><option>Semestral</option></select>
<div className="flex gap-2"><button onClick={()=>setShowNovo(false)} className="flex-1 bg-[#0A0A0A] border border-[#2A2A2A] py-3 rounded-xl text-xs">Cancelar</button><button onClick={criarAluno} className="flex-1 bg-[#C9A86A] text-black py-3 rounded-xl text-xs font-extrabold">Salvar</button></div>

</div>
